name: Snapshot & Deploy

on:
  schedule:
    # Alle 30 Minuten (UTC). GitHub kann Cron-Läufe um einige Minuten verzögern.
    - cron: "13,43 * * * *"
  workflow_dispatch: # manuell über den "Run workflow"-Button
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "README.md"]

permissions:
  contents: write # Daten-Commit
  pages: write
  id-token: write

concurrency:
  group: snapshot-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Snapshot von Spansh holen
        id: snapshot
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run snapshot

      - name: Daten committen
        if: github.event_name != 'push' && steps.snapshot.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- site/data/history.json; then
            echo "Keine neuen Marktupdates – kein Commit, nur Deploy."
          else
            git add site/data
            git commit -m "data: Marktupdates $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi

      - name: Frontend bauen (TypeScript → site/dist)
        run: npm run build

      - name: Cache-Busting (Version an JS/CSS hängen)
        run: npm run stamp

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
